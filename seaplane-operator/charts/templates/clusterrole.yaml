# Keep in sync with config/rbac/role.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "seaplane-operator.fullname" . }}
  labels:
    {{- include "seaplane-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["seaplane.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["seaplane.io"]
    resources: ["clusters/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["seaplane.io"]
    resources: ["clusters/finalizers"]
    verbs: ["update"]
  - apiGroups: ["seaplane.io"]
    resources: ["manifests"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["seaplane.io"]
    resources: ["manifests/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["seaplane.io"]
    resources: ["manifests/finalizers"]
    verbs: ["update"]
  - apiGroups: ["seaplane.io"]
    resources: ["nodepools"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["seaplane.io"]
    resources: ["nodepools/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["seaplane.io"]
    resources: ["nodepools/finalizers"]
    verbs: ["update"]
  - apiGroups: ["seaplane.io"]
    resources: ["placements"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["seaplane.io"]
    resources: ["placements/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["seaplane.io"]
    resources: ["oidcconfigs"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["seaplane.io"]
    resources: ["oidcconfigs/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["seaplane.io"]
    resources: ["oidcconfigs/finalizers"]
    verbs: ["update"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
